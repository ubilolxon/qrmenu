version: "2"
sql:
  - engine: postgresql
    schema: internal/postgres/migrations
    queries: internal/postgres/queries
    gen:
      go:
        package: gen
        out: internal/postgres/gen
        sql_package: pgx/v5

        emit_json_tags: false          # DTOs own the wire shape, not the DB layer
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_interface: true           # services take a Querier, not a concrete pool
        emit_empty_slices: true        # a query with no rows returns [], never nil

        overrides:
          # pgtype.UUID is awkward to pass around; google/uuid is a plain
          # [16]byte with the parsing and formatting already written.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          # Nullable uuid arguments appear in partial updates ("move this item
          # to another category, or leave it alone"). Without this they fall
          # back to pgtype.UUID and the service has to convert at every call.
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          # citext is case-insensitive at the database level, which is exactly
          # what email and slug want. In Go it is just a string.
          - db_type: "citext"
            go_type: "string"

          # The pgx driver defaults timestamptz to pgtype.Timestamptz even when
          # the column is NOT NULL, which would push a driver type into every
          # domain struct. Plain time.Time, and a pointer only where the column
          # really is nullable.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

          # Same reasoning for the two zoneless types the order path uses:
          # orders.business_day is a date, and the restaurant's local clock
          # comes back as a plain timestamp. Left alone they arrive as
          # pgtype.Date and pgtype.Timestamp, which would put a driver type in
          # every order struct for no gain — a business day is a day.
          - db_type: "date"
            go_type: "time.Time"
          # Spelled with the catalog prefix: plain "timestamp" is not matched,
          # unlike "timestamptz" and "date" above.
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"

          # jsonb translation fields are handled by internal/i18n, which knows
          # the locale-fallback rules. Keeping them as raw bytes here stops sqlc
          # from guessing at a shape.
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
